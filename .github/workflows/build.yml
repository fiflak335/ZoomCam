name: Build iOS IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-adhoc:
    name: Build IPA (No Signing)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build App (Ad-Hoc)
        run: |
          xcodebuild clean build \
            -project ZoomCam.xcodeproj \
            -scheme ZoomCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Release-iphoneos/ZoomCam.app Payload/
          zip -r ZoomCam.ipa Payload
          rm -rf Payload
          ls -la ZoomCam.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomCam-ipa
          path: ZoomCam.ipa
          retention-days: 30
